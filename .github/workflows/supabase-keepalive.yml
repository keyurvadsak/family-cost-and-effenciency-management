name: Live Supabase Database Keep-Alive

# Scheduled job to periodically make a lightweight request to the live deployment & Supabase project.
# This can help prevent inactivity, but it is not a guaranteed way to prevent pausing.
# Do not rely on this for production availability.
#
# Runs automatically in the cloud every 24 hours. Does not require your local computer to be on.
# All credentials remain strictly private and are never exposed publicly.

on:
  schedule:
    # Runs once every 24 hours at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions UI

jobs:
  live-health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --no-cache-dir sqlalchemy psycopg2-binary python-dotenv

      - name: Execute Live Keep-Alive Health Check
        env:
          # Optional: Read from GitHub Secrets if configured. If not configured, the script
          # safely pings the live Render endpoint which connects to Supabase without public creds.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LIVE_HEALTH_URL: "https://family-cost-and-effenciency-management.onrender.com/health"
        run: |
          python scripts/supabase_health_check.py --live-url "$LIVE_HEALTH_URL"
